<text x="100.0" y="19.0" font-size="12" text-anchor="middle" font-weight="bold">Sinh viên</text>
<text x="310.0" y="19.0" font-size="12" text-anchor="middle" font-weight="bold">Hệ thống web</text>
<text x="635.0" y="19.0" font-size="12" text-anchor="middle" font-weight="bold">SQL Server (sp_GhiNhanGiaoDich)</text>
<text x="100.0" y="101.7" font-size="11" text-anchor="middle">Chọn danh mục, ngày</text>
<text x="310.0" y="96.7" font-size="11" text-anchor="middle">Hiện hạn mức, đã chi, còn lại, tỷ lệ</text>
<text x="100.0" y="181.7" font-size="11" text-anchor="middle">Nhập số tiền, mô tả</text>
<text x="310.0" y="181.7" font-size="11" text-anchor="middle">Dự báo mức cảnh báo khi đang gõ</text>
<text x="100.0" y="263.7" font-size="11" text-anchor="middle">Bấm Ghi nhận</text>
<text x="310.0" y="261.4" font-size="10" text-anchor="middle">Số tiền &gt; 0?</text>
<text x="625.0" y="261.7" font-size="11" text-anchor="middle">Mở transaction, khóa dòng hạn mức</text>
<text x="625.0" y="338.4" font-size="10" text-anchor="middle">Có hạn mức, chưa</text><text x="625.0" y="350.4" font-size="10" text-anchor="middle">khóa?</text>
<text x="625.0" y="433.4" font-size="10" text-anchor="middle">Tổng dự kiến &gt; hạn</text><text x="625.0" y="445.4" font-size="10" text-anchor="middle">mức?</text>
<text x="520.0" y="531.4" font-size="10" text-anchor="middle">Loại hạn mức?</text>
<text x="735.0" y="517.3" font-size="11" text-anchor="middle">Lưu giao dịch Hợp lệ, cộng đã chi,</text><text x="735.0" y="530.5" font-size="11" text-anchor="middle">tính lại trạng thái</text>
<text x="470.0" y="617.3" font-size="11" text-anchor="middle">Ghi nhật ký vi phạm</text><text x="470.0" y="630.5" font-size="11" text-anchor="middle">(Từ chối)</text>
<text x="600.0" y="617.3" font-size="11" text-anchor="middle">Lưu giao dịch Chờ</text><text x="600.0" y="630.5" font-size="11" text-anchor="middle">duyệt, tạo yêu cầu, báo</text><text x="600.0" y="643.7" font-size="11" text-anchor="middle">người cấp ngân sách</text>
<text x="735.0" y="618.4" font-size="10" text-anchor="middle">Vừa đạt ngưỡng /</text><text x="735.0" y="630.4" font-size="10" text-anchor="middle">100%?</text>
<text x="735.0" y="711.7" font-size="11" text-anchor="middle">Tạo thông báo cảnh báo</text>
<text x="625.0" y="811.7" font-size="11" text-anchor="middle">COMMIT</text>
<text x="310.0" y="833.7" font-size="11" text-anchor="middle">Hiện thông báo kết quả</text>
<text x="100.0" y="833.7" font-size="11" text-anchor="middle">Xem kết quả, số còn lại</text>
