<text x="36.0" y="135.2" font-size="12" font-weight="bold">web</text>
<text x="155.0" y="166.4" font-size="10" text-anchor="middle">Ảnh build từ Dockerfile: Node 20 build React,</text><text x="155.0" y="178.4" font-size="10" text-anchor="middle">.NET SDK 8 publish, chạy trên aspnet:8.0</text>
<text x="155.0" y="227.4" font-size="10" text-anchor="middle">Cổng 8080 → localhost:8080</text><text x="155.0" y="239.4" font-size="10" text-anchor="middle">XacThuc__CheDo = Oidc</text>
<text x="331.0" y="135.2" font-size="12" font-weight="bold">keycloak</text>
<text x="450.0" y="166.4" font-size="10" text-anchor="middle">quay.io/keycloak/keycloak:26.0, start-dev</text><text x="450.0" y="178.4" font-size="10" text-anchor="middle">--import-realm</text>
<text x="450.0" y="227.4" font-size="10" text-anchor="middle">Cổng 8080 → localhost:8081</text><text x="450.0" y="239.4" font-size="10" text-anchor="middle">nạp keycloak/hanmuc-realm.json</text>
<text x="626.0" y="135.2" font-size="12" font-weight="bold">csdl</text>
<text x="745.0" y="172.4" font-size="10" text-anchor="middle">mcr.microsoft.com/mssql/server:2022-latest</text>
<text x="745.0" y="227.4" font-size="10" text-anchor="middle">Cổng 1433 → localhost:14333</text><text x="745.0" y="239.4" font-size="10" text-anchor="middle">volume csdl-data</text>
